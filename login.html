<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - Certificate Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <h2>🔐 Portal Login</h2>
            <p>Aapke Certificate Generator System me swagat hai.</p>
            
            <form id="loginForm">
                <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                    <label>Username / Admin ID:</label>
                    <input type="text" id="username" placeholder="Enter username (admin)" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                    <label>Password:</label>
                    <input type="password" id="password" placeholder="Enter password (admin123)" required>
                </div>
                <button type="submit" class="btn btn-primary login-btn">Login to Portal</button>
                <p id="errorMsg" class="error-msg hidden">Galat Username ya Password hai!</p>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
